# Deploy buyer + seller to Firebase Hosting.
#
# REQUIRED: GitHub secret FIREBASE_TOKEN
#   firebase login:ci
#   GitHub → dnols_market → Settings → Secrets → Actions → FIREBASE_TOKEN

name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build buyer
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: dnols-2a394.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: dnols-2a394
        run: npm run build:prod

      - name: Build seller
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: dnols-2a394.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: dnols-2a394
        run: cd shop && npm ci && VITE_API_URL=https://dnols-83jj.onrender.com npm run build

      - name: Upload buyer dist (backup if deploy fails)
        uses: actions/upload-artifact@v4
        with:
          name: buyer-dist
          path: dist/
          retention-days: 7

      - name: Check FIREBASE_TOKEN
        id: token
        run: |
          if [ -z "${{ secrets.FIREBASE_TOKEN }}" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "::error::FIREBASE_TOKEN secret is not set. Run: firebase login:ci then add token to GitHub Secrets."
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting:buyer,hosting:shop --project dnols-2a394
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Purge Cloudflare copy of sw.js
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE" ] || [ -z "$CF_TOKEN" ]; then
            echo "Add CLOUDFLARE_ZONE_ID and CLOUDFLARE_API_TOKEN to GitHub secrets, or purge https://dnols.com/sw.js and https://shop.dnols.com/sw.js in the Cloudflare dashboard. Without that, installed PWAs keep the year-cached worker."
            exit 0
          fi
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://dnols.com/sw.js","https://dnols.com/dnols-sw.js","https://shop.dnols.com/sw.js","https://shop.dnols.com/dnols-sw.js","https://dnols.com/","https://shop.dnols.com/"]}'
