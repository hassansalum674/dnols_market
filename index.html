<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("dnols.settings.v1") || "{}");
          var mode = s.theme || "light";
          var theme = mode;
          if (mode === "system") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (theme !== "dark") theme = "light";
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#0D0D0D" : "#ffffff");
          var apple = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (apple) apple.setAttribute("content", theme === "dark" ? "black-translucent" : "default");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-title" content="Dnols" />
    <meta name="description" content="Dnols — shops you can walk to in Kariakoo and Dar es Salaam." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Dnols</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
