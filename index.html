<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (function () {
        try {
          var theme = "light";
          var lang = "en";
          var params = new URLSearchParams(location.search);
          var qTheme = params.get("theme");
          var qLang = params.get("lang");
          var cookie = {};
          document.cookie.split("; ").forEach(function (part) {
            if (part.indexOf("dnols.prefs=") === 0) {
              cookie = JSON.parse(decodeURIComponent(part.slice("dnols.prefs=".length)));
            }
          });
          var s = {};
          try {
            s = JSON.parse(localStorage.getItem("dnols.settings.v1") || "{}");
          } catch (e) {}
          var mode = qTheme || cookie.theme || s.theme || "light";
          if (mode === "system") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          } else if (mode === "dark") {
            theme = "dark";
          }
          lang = qLang || cookie.language || s.language || "en";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.lang = lang === "sw" ? "sw" : "en";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#0D0D0D" : "#ffffff");
          var apple = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (apple) apple.setAttribute("content", theme === "dark" ? "black-translucent" : "default");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-title" content="Dnols" />
    <meta name="description" content="Dnols — shops you can walk to in Kariakoo and Dar es Salaam." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Dnols</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
