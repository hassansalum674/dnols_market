# Dnols — Render blueprint (API + buyer + seller static sites)
# https://render.com/docs/blueprint-spec

services:
  # ── API (backend) ──
  - type: web
    name: dnols-api
    runtime: node
    rootDir: api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_PUBLIC_URL
        value: https://dnols-83jj.onrender.com
      - key: CORS_ORIGIN
        value: "*"
      - key: FAPIAPI_API_KEY
        sync: false

  # ── Buyer PWA (repo root) ──
  - type: web
    name: dnols-buyer
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://dnols-83jj.onrender.com

  # ── Seller PWA (shop/) ──
  - type: web
    name: dnols-shop
    runtime: static
    rootDir: shop
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://dnols-83jj.onrender.com
